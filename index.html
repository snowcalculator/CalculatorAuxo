<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Auxo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .calculator {
      width: 350px;
      background: #181818;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .title {
      color: white;
      text-align: center;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      height: 90px;
      background: #292929;
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 38px;
      text-align: right;
      padding: 15px;
      margin-bottom: 15px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 15px;
      font-size: 22px;
      cursor: pointer;
      background: #333;
      color: white;
      transition: .15s;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(.94);
    }

    .operator {
      background: #ff9500;
    }

    .clear {
      background: #ff3b30;
    }

    .equal {
      background: #34c759;
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      color: #aaa;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="title">Calculator Auxo</div>

    <input
      type="text"
      id="display"
      class="display"
      value="0"
      readonly
    >

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="percentage()">%</button>
      <button class="operator" onclick="operator('/')">÷</button>

      <button onclick="number('7')">7</button>
      <button onclick="number('8')">8</button>
      <button onclick="number('9')">9</button>
      <button class="operator" onclick="operator('*')">×</button>

      <button onclick="number('4')">4</button>
      <button onclick="number('5')">5</button>
      <button onclick="number('6')">6</button>
      <button class="operator" onclick="operator('-')">−</button>

      <button onclick="number('1')">1</button>
      <button onclick="number('2')">2</button>
      <button onclick="number('3')">3</button>
      <button class="operator" onclick="operator('+')">+</button>

      <button class="zero" onclick="number('0')">0</button>
      <button onclick="decimal()">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
      Calculator Auxo © 2026
    </div>

  </div>

<script>
  const display = document.getElementById("display");

  let current = "0";
  let previous = null;
  let operation = null;
  let resetScreen = false;

  function updateDisplay() {
    display.value = current;
  }

  function number(num) {
    if (current === "0" || resetScreen) {
      current = num;
      resetScreen = false;
    } else {
      current += num;
    }

    updateDisplay();
  }

  function decimal() {
    if (resetScreen) {
      current = "0.";
      resetScreen = false;
    } else if (!current.includes(".")) {
      current += ".";
    }

    updateDisplay();
  }

  function operator(op) {
    if (operation !== null) {
      calculate();
    }

    previous = parseFloat(current);
    operation = op;
    resetScreen = true;
  }

  function calculate() {
    if (operation === null || previous === null) return;

    const currentNumber = parseFloat(current);
    let result;

    switch (operation) {
      case "+":
        result = previous + currentNumber;
        break;

      case "-":
        result = previous - currentNumber;
        break;

      case "*":
        result = previous * currentNumber;
        break;

      case "/":
        if (currentNumber === 0) {
          current = "Error";
          previous = null;
          operation = null;
          updateDisplay();
          return;
        }
        result = previous / currentNumber;
        break;
    }

    current = String(
      Math.round((result + Number.EPSILON) * 100000000) / 100000000
    );

    previous = null;
    operation = null;
    resetScreen = true;

    updateDisplay();
  }

  function clearDisplay() {
    current = "0";
    previous = null;
    operation = null;
    resetScreen = false;
    updateDisplay();
  }

  function deleteLast() {
    if (current.length > 1) {
      current = current.slice(0, -1);
    } else {
      current = "0";
    }

    updateDisplay();
  }

  function percentage() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  document.addEventListener("keydown", function(event) {

    if (event.key >= "0" && event.key <= "9") {
      number(event.key);
    }

    if (event.key === ".") {
      decimal();
    }

    if (["+", "-", "*", "/"].includes(event.key)) {
      operator(event.key);
    }

    if (event.key === "Enter" || event.key === "=") {
      calculate();
    }

    if (event.key === "Escape") {
      clearDisplay();
    }

    if (event.key === "Backspace") {
      deleteLast();
    }
  });
</script>

</body>
</html>
